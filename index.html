<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TfL Topographical Course Package – Keeping Left</title>
  <meta name="description"
    content="Keeping Left topographical route-drawing exam simulator for TfL taxi knowledge practice.">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <style>
    :root {
      --blue: #1f6fd0;
      --blue-dark: #164f96;
      --bar: #f1f3f6;
      --line: #cfd5de;
      --green: #2ecc71;
      --red: #e74c3c;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      height: 100%;
      font-family: "Segoe UI", Roboto, Arial, sans-serif;
      color: #1c2430;
    }

    #app {
      display: grid;
      height: 100%;
      grid-template-rows: 40px 1fr 56px;
      grid-template-columns: 250px 1fr;
    }

    #breadcrumb {
      grid-column: 1 / 3;
      display: flex;
      align-items: center;
      padding: 0 16px;
      background: #fff;
      border-bottom: 1px solid var(--line);
      font-size: 14px;
      color: #4a5565;
      gap: 8px;
    }

    #breadcrumb .sep {
      color: #9aa4b2;
    }

    #breadcrumb .current {
      color: #1c2430;
      font-weight: 600;
    }

    #sidebar {
      background: #fff;
      border-right: 1px solid var(--line);
      padding: 18px 16px;
      overflow: auto;
    }

    #sidebar .site {
      font-weight: 700;
      color: var(--blue);
      font-size: 15px;
      margin-bottom: 18px;
    }

    #sidebar h2 {
      font-size: 18px;
      margin: 0 0 10px;
    }

    #sidebar p {
      margin: 0 0 10px;
      font-size: 14.5px;
      line-height: 1.45;
    }

    #sidebar .qno {
      margin-top: 24px;
      font-size: 12px;
      color: #7a8594;
      text-transform: uppercase;
      letter-spacing: .08em;
    }

    #main {
      position: relative;
      min-width: 0;
      min-height: 0;
    }

    #controls {
      position: absolute;
      z-index: 1000;
      top: 8px;
      left: 10px;
      display: flex;
      gap: 6px;
      background: #ffffff;
      padding: 3px 4px;
      border: 1px solid #c8d0da;
      border-radius: 4px;
      box-shadow: 0 1px 4px rgba(0, 0, 0, 0.12);
    }

    #controls button {
      font: 700 12px "Segoe UI", Roboto, Arial, sans-serif;
      letter-spacing: .06em;
      padding: 5px 16px;
      border-radius: 2px;
      cursor: pointer;
      background: #ffffff;
      transition: background .15s, border-color .15s, transform .05s;
    }

    #controls button:active {
      transform: translateY(1px);
    }

    #controls button#btnDraw {
      color: #27ae60;
      border: 1px solid #2ecc71;
      background: #ffffff;
    }

    #controls button#btnDraw:hover {
      background: #edf9f0;
    }

    /* STOP mode styling: white background, dark text, yellow/amber border */
    #controls button#btnDraw.drawing-active,
    #controls button#btnDraw.on {
      background: #ffffff !important;
      color: #333333 !important;
      border: 1px solid #f1c40f !important;
      box-shadow: 0 0 4px rgba(241, 196, 15, 0.4);
    }

    #controls button#btnBack {
      color: #2980b9;
      border: 1px solid #3498db;
      background: #ffffff;
    }

    #controls button#btnBack:hover {
      background: #ebf5fb;
    }

    #controls button#btnDelete {
      color: #e74c3c;
      border: 1px solid #e74c3c;
      background: #ffffff;
    }

    #controls button#btnDelete:hover {
      background: #fdf2f0;
    }

    #controls button#btnBright {
      color: #7f8c8d;
      border: 1px solid #bdc3c7;
      background: #ffffff;
    }

    #controls button#btnBright:hover {
      background: #f2f4f4;
    }

    #controls button#btnHome {
      color: #555555;
      border: 1px solid #bdc3c7;
      background: #dedede;
    }

    #controls button#btnHome:hover {
      background: #d4d4d4;
    }

    .leaflet-top.leaflet-left {
      margin-top: 38px;
    }

    #map {
      position: absolute;
      inset: 0;
      background: #eef2f6;
    }

    #map.drawing,
    #map.drawing .leaflet-container {
      cursor: crosshair !important;
    }

    .leaflet-container {
      cursor: grab;
    }

    .leaflet-container:active {
      cursor: grabbing;
    }

    .teardrop-marker {
      background: transparent;
      border: none;
      pointer-events: none;
    }

    /* Cursor follower 8x8px white square */
    .cursor-follower {
      position: absolute;
      width: 8px;
      height: 8px;
      background: #ffffff;
      border: 1px solid #3388ff;
      box-sizing: border-box;
      pointer-events: none;
      z-index: 2500;
      display: none;
      transform: translate(-50%, -50%);
    }

    /* Floating cursor tooltip */
    .cursor-tooltip {
      position: absolute;
      z-index: 2500;
      pointer-events: none;
      background: rgba(0, 0, 0, 0.75);
      color: #ffffff;
      font-size: 12px;
      font-family: "Segoe UI", Roboto, Arial, sans-serif;
      line-height: 1.2;
      padding: 3px 8px;
      border-radius: 3px;
      white-space: nowrap;
      display: none;
      transform: translateY(-50%);
    }

    #bottom {
      grid-column: 1 / 3;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      background: var(--bar);
      border-top: 1px solid var(--line);
    }

    #bottom a {
      color: var(--blue);
      font-size: 14.5px;
      cursor: pointer;
      text-decoration: underline;
    }

    #next {
      position: absolute;
      right: 18px;
      top: 10px;
      height: 36px;
      padding: 0 26px;
      border: 0;
      border-radius: 18px;
      background: var(--blue);
      color: #fff;
      font: 600 14.5px "Segoe UI", Arial, sans-serif;
      cursor: pointer;
      transition: background .15s;
    }

    #next:hover {
      background: var(--blue-dark);
    }

    #overlay {
      position: fixed;
      inset: 0;
      z-index: 5000;
      display: none;
      align-items: center;
      justify-content: center;
      background: rgba(20, 30, 45, .7);
    }

    #overlay.show {
      display: flex;
    }

    #overlay .card {
      background: #fff;
      border-radius: 12px;
      padding: 34px 44px;
      width: 420px;
      text-align: center;
      box-shadow: 0 10px 40px rgba(0, 0, 0, .4);
    }

    #overlay h2 {
      margin: 0 0 20px;
    }

    .bar {
      height: 12px;
      background: #e3e8ef;
      border-radius: 6px;
      overflow: hidden;
    }

    .bar i {
      display: block;
      height: 100%;
      width: 0;
      background: linear-gradient(90deg, #2d86ee, #1fa84f);
      transition: width 2.2s ease;
    }

    #continue {
      margin-top: 22px;
      display: none;
      padding: 10px 34px;
      border: 0;
      border-radius: 20px;
      background: var(--blue);
      color: #fff;
      font: 600 15px "Segoe UI", Arial, sans-serif;
      cursor: pointer;
    }

    /* Answer-view tab */
    body.answer #controls,
    body.answer #next {
      display: none;
    }
  </style>
</head>

<body>
  <div id="app">
    <nav id="breadcrumb" aria-label="Breadcrumb">
      <span>TfL Topographical Course Package</span><span class="sep">&gt;</span>
      <span>Basics</span><span class="sep">&gt;</span>
      <span>Keeping Left</span><span class="sep">&gt;</span>
      <span class="current">Keeping Left</span>
    </nav>

    <aside id="sidebar">
      <div class="site">www.serupractice.com</div>
      <h1 style="display:none">Keeping Left Exam Simulator</h1>
      <h2>Practice keeping left.</h2>
      <p>Draw a route from the green marker to the red marker.</p>
      <div class="qno" id="qno"></div>
    </aside>

    <main id="main">
      <div id="controls">
        <button id="btnDraw" type="button">DRAW</button>
        <button id="btnBack" type="button">BACK</button>
        <button id="btnDelete" type="button">DELETE</button>
        <button id="btnBright" type="button">BRIGHT</button>
        <button id="btnHome" type="button">HOME</button>
      </div>
      <div id="map"></div>
      <div id="cursorFollower" class="cursor-follower"></div>
      <div id="cursorTooltip" class="cursor-tooltip">Click to start drawing line</div>
    </main>

    <footer id="bottom">
      <a id="answerLink">Click here to view answer in a new tab.</a>
      <button id="next" type="button">Next</button>
    </footer>
  </div>

  <div id="overlay" role="dialog" aria-modal="true">
    <div class="card">
      <h2>Quiz Completed</h2>
      <div class="bar"><i id="fill"></i></div>
      <button id="continue" type="button">Continue</button>
    </div>
  </div>

  <script>
    (function () {
      'use strict';

      /* ---------- Coordinate system & CRS Lock ----------
         CRS.Simple with Transformation(1, 0, 1, 0) and scale = 2^z.
         At zoom 8: 1 tile = 256px = 1 coordinate unit.
         Coordinates are expressed as [lat = tileY, lng = tileX] in Zoom-8 tile units.
         For any zoom level z (4..8), crs.latLngToPoint(latlng, z) scales strictly by 2^(z-8)
         so physical streets across tiles/8, tiles/7, tiles/6, tiles/5, tiles/4 are 100% locked. */
      var CRS = L.extend({}, L.CRS.Simple, {
        transformation: new L.Transformation(1, 0, 1, 0),
        scale: function (z) { return Math.pow(2, z); },
        zoom: function (s) { return Math.log(s) / Math.LN2; },
        infinite: true
      });

      /* ---------- Exact Compact Pin Generator ----------
         Matches softmaps.io reference: width="22" height="34" viewBox="0 0 24 36", iconSize: [22, 34], iconAnchor: [11, 34].
         Outer teardrop path filled with #2ecc71 (green) / #e74c3c (red) and stroke #1f5a32 / #781e16 (stroke-width="1.5").
         Inner head circle: cx="12" cy="11" r="3.5" fill="#111111". */
      function makePin(color) {
        var isGreen = (color === 'start' || color === 'green' || color === '#2ecc71');
        var fill = isGreen ? '#2ecc71' : '#e74c3c';
        var stroke = isGreen ? '#1f5a32' : '#781e16';
        var svg = '<svg xmlns="http://www.w3.org/2000/svg" width="22" height="34" viewBox="0 0 24 36">' +
          '<path d="M 12 35.5 C 11 31.5 2 19.5 2 11 A 10 10 0 1 1 22 11 C 22 19.5 13 31.5 12 35.5 Z" ' +
          'fill="' + fill + '" stroke="' + stroke + '" stroke-width="1.5" stroke-linejoin="round"/>' +
          '<circle cx="12" cy="11" r="3.5" fill="#111111"/>' +
          '</svg>';
        return L.divIcon({
          className: 'teardrop-marker',
          html: '<div style="filter: drop-shadow(0 2px 3px rgba(0,0,0,0.35)); width: 22px; height: 34px; line-height: 0;">' + svg + '</div>',
          iconSize: [22, 34],
          iconAnchor: [11, 34]
        });
      }

      /* ---------- Questions calibrated to KeepingLeft16Oct4 ---------- */
      var QUESTIONS = [
        {
          // Question 1:
          // Green Marker: Bellevue Road near Wandsworth Common grass edge opposite Althorp Rd
          // Red Marker: Bolingbroke Grove directly over "OKE" at Thurleigh Rd / Blenkarne Rd junction
          // Initial Home: Zoom 8 centered so Earlsfield Rd (B234) is on far left and Clapham South on far right.
          title: "Bellevue Rd to Bolingbroke Grove",
          homeCenter: [98.42, 113.65],
          homeZoom: 8,
          start: [98.768, 113.521],
          end: [97.047, 113.992],
          answer: [
            [98.768, 113.521],
            [98.620, 113.545],
            [98.475, 113.575],
            [98.355, 113.625],
            [98.300, 113.675],
            [98.245, 113.725],
            [98.130, 113.795],
            [97.980, 113.880],
            [97.830, 113.955],
            [97.680, 114.030],
            [97.580, 114.020],
            [97.460, 113.980],
            [97.350, 113.955],
            [97.230, 113.930],
            [97.120, 113.960],
            [97.047, 113.992]
          ]
        },
        {
          // Question 2: Nightingale Lane East to West
          title: "Nightingale Lane East to West",
          homeCenter: [97.04, 115.18],
          homeZoom: 8,
          start: [96.420, 116.320],
          end: [97.660, 114.050],
          answer: [
            [96.420, 116.320],
            [96.480, 116.080],
            [96.580, 115.780],
            [96.720, 115.400],
            [96.900, 115.000],
            [97.100, 114.650],
            [97.300, 114.350],
            [97.500, 114.150],
            [97.660, 114.050]
          ]
        },
        {
          // Question 3: Rowfant Rd to Bellevue Rd
          title: "Rowfant Rd to Bellevue Rd",
          homeCenter: [98.53, 114.31],
          homeZoom: 8,
          start: [98.700, 115.000],
          end: [98.475, 113.575],
          answer: [
            [98.700, 115.000],
            [98.620, 114.780],
            [98.500, 114.500],
            [98.380, 114.150],
            [98.245, 113.725],
            [98.300, 113.675],
            [98.475, 113.575]
          ]
        }
      ];

      QUESTIONS.forEach(function (q) {
        q.route = [];
      });

      /* ---------- Map Initialization ---------- */
      var answerMode = /[?&]answer=(\d)/.exec(location.search);
      var map = L.map('map', {
        crs: CRS,
        minZoom: 4,
        maxZoom: 8,
        zoom: 8,
        center: QUESTIONS[0].homeCenter,
        attributionControl: false,
        zoomSnap: 1,
        zoomControl: true
      });

      var GCS = 'https://storage.googleapis.com/map-serpractice-photos/tile_{z}_{x}-{y}.png';
      var BLANK = 'data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7';

      var tiles = L.tileLayer('exercises/KeepingLeft16Oct4/tiles/{z}/{x}/{y}.png', {
        tileSize: 256,
        minZoom: 4,
        maxZoom: 8,
        noWrap: true,
        opacity: 1
      }).addTo(map);

      tiles.on('tileerror', function (e) {
        var t = e.tile;
        if (!t._fb) {
          t._fb = true;
          t.src = GCS.replace('{z}', e.coords.z).replace('{x}', e.coords.x).replace('{y}', e.coords.y);
        } else {
          t.onerror = null;
          t.src = BLANK;
        }
      });

      /* ---------- Layers & Markers ---------- */
      var qi = 0;
      var isDrawing = false;
      var bright = true;
      var isHoveringLastVertex = false;

      // Single clean royal-blue Leaflet polyline (no dual-layer casing, no dashed preview lines)
      var routePolyline = L.polyline([], {
        color: '#0073e6',
        weight: 4,
        opacity: 0.8,
        lineCap: 'round',
        lineJoin: 'round',
        interactive: false
      }).addTo(map);

      var markerLayer = L.layerGroup().addTo(map);
      var answerLayer = L.layerGroup().addTo(map);

      var $ = function (id) { return document.getElementById(id); };
      var mapDiv = $('map');
      var followerEl = $('cursorFollower');
      var tooltipEl = $('cursorTooltip');

      /* ---------- Cursor Follower & Tooltip ---------- */
      function updateCursorTooltip() {
        if (!isDrawing) {
          tooltipEl.style.display = 'none';
          followerEl.style.display = 'none';
          return;
        }
        tooltipEl.style.display = 'block';
        followerEl.style.display = 'block';

        if (isHoveringLastVertex) {
          tooltipEl.textContent = 'Click last point to finish line';
        } else if (QUESTIONS[qi].route.length === 0) {
          tooltipEl.textContent = 'Click to start drawing line';
        } else {
          tooltipEl.textContent = 'Click to continue drawing line';
        }
      }

      function checkLastVertexHover(e) {
        var pts = QUESTIONS[qi].route;
        if (!isDrawing || pts.length === 0) {
          isHoveringLastVertex = false;
          return;
        }
        var lastPt = pts[pts.length - 1];
        var p1 = map.latLngToContainerPoint(lastPt);
        var p2 = map.mouseEventToContainerPoint(e);
        isHoveringLastVertex = (Math.hypot(p1.x - p2.x, p1.y - p2.y) <= 12);
      }

      function updateCursorPosition(e) {
        if (!isDrawing) return;
        var rect = mapDiv.getBoundingClientRect();
        var mx = e.clientX - rect.left;
        var my = e.clientY - rect.top;

        followerEl.style.left = mx + 'px';
        followerEl.style.top = my + 'px';
        tooltipEl.style.left = (mx + 15) + 'px';
        tooltipEl.style.top = my + 'px';
      }

      mapDiv.addEventListener('mousemove', function (e) {
        if (isDrawing) {
          checkLastVertexHover(e);
          updateCursorPosition(e);
          updateCursorTooltip();
        }
      });

      mapDiv.addEventListener('mouseleave', function () {
        followerEl.style.display = 'none';
        tooltipEl.style.display = 'none';
        isHoveringLastVertex = false;
      });

      mapDiv.addEventListener('mouseenter', function (e) {
        if (isDrawing) {
          checkLastVertexHover(e);
          updateCursorPosition(e);
          updateCursorTooltip();
        }
      });

      function setDrawing(on) {
        isDrawing = on;
        isHoveringLastVertex = false;
        var btn = $('btnDraw');
        btn.textContent = on ? 'STOP' : 'DRAW';
        btn.classList.toggle('drawing-active', on);
        btn.classList.toggle('on', on);
        $('map').classList.toggle('drawing', on);

        updateCursorTooltip();
      }

      function loadQuestion(i) {
        qi = i;
        var q = QUESTIONS[i];
        setDrawing(false);
        markerLayer.clearLayers();

        // Start (Green) and End (Red) compact pins
        L.marker(q.start, { icon: makePin('start'), interactive: false, keyboard: false }).addTo(markerLayer);
        L.marker(q.end, { icon: makePin('end'), interactive: false, keyboard: false }).addTo(markerLayer);

        routePolyline.setLatLngs(q.route);

        map.setView(q.homeCenter, q.homeZoom, { animate: false });
        $('qno').textContent = 'Question ' + (i + 1) + ' of ' + QUESTIONS.length;
        $('next').textContent = (i === QUESTIONS.length - 1) ? 'Finish Quiz' : 'Next';
      }

      /* ---------- Clean Click, Right-Click & Route Manipulation ---------- */
      var downPos = null;

      mapDiv.addEventListener('mousedown', function (e) {
        if (e.button === 0) {
          downPos = { x: e.clientX, y: e.clientY };
        }
      });

      mapDiv.addEventListener('mouseup', function (e) {
        if (e.button !== 0 || !downPos) return;
        var dist = Math.hypot(e.clientX - downPos.x, e.clientY - downPos.y);
        downPos = null;

        // Ignore drags / panning
        if (dist > 5) return;
        if (!isDrawing) return;

        // Clicking last point finishes drawing line
        if (isHoveringLastVertex) {
          isHoveringLastVertex = false;
          setDrawing(false);
          return;
        }

        var latlng = map.mouseEventToLatLng(e);
        var q = QUESTIONS[qi];

        // If starting and clicked close to start pin, snap cleanly
        var startScreenPos = map.latLngToContainerPoint(q.start);
        var clickScreenPos = map.mouseEventToContainerPoint(e);
        var distToStart = Math.hypot(clickScreenPos.x - startScreenPos.x, clickScreenPos.y - startScreenPos.y);

        var pt;
        if (q.route.length === 0 && distToStart <= 30) {
          pt = [q.start[0], q.start[1]];
        } else {
          pt = [latlng.lat, latlng.lng];
        }

        q.route.push(pt);
        routePolyline.setLatLngs(q.route);
        updateCursorTooltip();
      });

      // Right-click removes the last vertex
      function removeLastVertex() {
        if (QUESTIONS[qi].route.length > 0) {
          QUESTIONS[qi].route.pop();
          routePolyline.setLatLngs(QUESTIONS[qi].route);
          isHoveringLastVertex = false;
          updateCursorTooltip();
        }
      }

      mapDiv.addEventListener('contextmenu', function (e) {
        e.preventDefault();
        removeLastVertex();
      });

      /* ---------- Control Buttons ---------- */
      $('btnDraw').onclick = function () {
        setDrawing(!isDrawing);
      };

      $('btnBack').onclick = function () {
        removeLastVertex();
      };

      $('btnDelete').onclick = function () {
        if (confirm('Clear the Route?')) {
          QUESTIONS[qi].route = [];
          routePolyline.setLatLngs([]);
          setDrawing(false);
        }
      };

      $('btnBright').onclick = function () {
        bright = !bright;
        tiles.setOpacity(bright ? 1.0 : 0.35);
      };

      $('btnHome').onclick = function () {
        var q = QUESTIONS[qi];
        map.setView(q.homeCenter, q.homeZoom);
      };

      $('answerLink').onclick = function () {
        var base = location.href.split('?')[0].split('#')[0];
        window.open(base + '?answer=' + (qi + 1), '_blank');
      };

      $('next').onclick = function () {
        if (qi < QUESTIONS.length - 1) {
          loadQuestion(qi + 1);
          return;
        }
        finishQuiz();
      };

      function finishQuiz() {
        var ov = $('overlay'), fill = $('fill'), cont = $('continue');
        cont.style.display = 'none';
        fill.style.width = '0';
        ov.classList.add('show');
        setTimeout(function () { fill.style.width = '100%'; }, 50);
        setTimeout(function () { cont.style.display = 'inline-block'; }, 2400);
      }

      $('continue').onclick = function () {
        QUESTIONS.forEach(function (q) { q.route = []; });
        $('overlay').classList.remove('show');
        loadQuestion(0);
      };

      /* ---------- Answer Mode Tab (?answer=N) ---------- */
      if (answerMode) {
        document.body.classList.add('answer');
        var n = Math.max(0, Math.min(QUESTIONS.length - 1, parseInt(answerMode[1], 10) - 1));
        loadQuestion(n);

        // Answer polyline in clean green
        L.polyline(QUESTIONS[n].answer, {
          color: '#2ecc71',
          weight: 4,
          opacity: 0.9,
          lineCap: 'round',
          lineJoin: 'round'
        }).addTo(answerLayer);

        $('answerLink').textContent = 'Answer route – ' + QUESTIONS[n].title;
        $('answerLink').onclick = null;
        $('answerLink').style.textDecoration = 'none';
        $('answerLink').style.cursor = 'default';
      } else {
        loadQuestion(0);
      }
    })();
  </script>
</body>

</html>
